name: PR Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (self-hosted Windows)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on:
      - self-hosted
      - Windows
      - X64
    env:
      PEAK_GAME_ROOT: ${{ vars.PEAK_GAME_ROOT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PeakLanMod.slnx

      - name: Validate PEAK managed assemblies path
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PEAK_GAME_ROOT)) {
            throw "Repository variable PEAK_GAME_ROOT is not set. Configure it to the PEAK install root, e.g. C:/Program Files (x86)/Steam/steamapps/common/PEAK"
          }

          $managedDir = Join-Path $env:PEAK_GAME_ROOT "PEAK_Data/Managed"
          if (-not (Test-Path $managedDir)) {
            throw "Managed assemblies directory not found: $managedDir"
          }

          Write-Host "Using PEAK managed assemblies: $managedDir"

      - name: Build
        run: >-
          dotnet build PeakLanMod.slnx
          --configuration Release
          --no-restore
          -p:DeployModFiles=false
          -p:RunThunderPipePackAfterBuild=false
          -p:PEAKGameRootDir="${{ env.PEAK_GAME_ROOT }}"
