name: PR Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (self-hosted Windows)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on:
      - self-hosted
      - Windows
      - X64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PeakLanMod.slnx

      - name: Build
        run: >-
          dotnet build PeakLanMod.slnx
          --configuration Release
          --no-restore
          -p:DeployModFiles=false
          -p:RunThunderPipePackAfterBuild=false
